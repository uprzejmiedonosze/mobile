# Wydanie Android na runnerze GitHuba: `eas build --local` (nie zużywa limitu buildów planu Free EAS) → EAS Submit
# do Google Play → nazwa i „Co nowego” z CHANGELOG-a (scripts/play-notes.js). Patrz docs/RELEASE.md, „GitHub Actions”.
#   - push tagu vX.Y.Z (make release-*)       → profil production → tor z eas.json (submit.production: production), szkic
#   - ręcznie (make staging-play / Actions → Run) → staging-play z main → internal, od razu u testerów,
#                                                  albo production na tagu (make release-android-run)
# Podpis (keystore uploadu) i versionCode (appVersionSource: remote + autoIncrement) nadal biorą się z EAS – przez EXPO_TOKEN.
# Sekrety repo: EXPO_TOKEN, SENTRY_AUTH_TOKEN (zmienne EAS typu secret nie są dostępne poza serwerami EAS),
# PLAY_SERVICE_ACCOUNT_JSON (treść klucza konta usługi Play).
name: Wydanie Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: Profil EAS
        type: choice
        options: [staging-play, production]
        default: staging-play
      notes:
        description: „Co nowego” (streszczenie z make staging-play; puste = punkty z CHANGELOG-a, przycięte)
        type: string
        required: false

concurrency:
  group: android-${{ github.event_name == 'push' && 'production' || inputs.profile }}
  cancel-in-progress: false

env:
  PROFILE: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
  EAS_VERSION: 24.14.0

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Production tylko z tagu bieżącej wersji (tag stawia make release-*).
      - name: Production tylko z tagu vVERSION
        if: env.PROFILE == 'production'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$(git describe --exact-match --tags HEAD 2>/dev/null)" = "v$version" \
            || { echo "::error::HEAD nie jest na tagu v$version"; exit 1; }

      # Build RN zajmuje kilkanaście GB – zwalniamy miejsce po narzędziach, których nie używamy.
      - name: Miejsce na dysku
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Katalog roboczy builda zostaje (SKIP_CLEANUP), żeby zachować mapping.txt z R8 w artefakcie joba
      # (Play bierze plik deobfuskacji sam z AAB: BUNDLE-METADATA/…/proguard.map).
      - name: Build (eas build --local)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-build
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
        run: eas build --local --non-interactive --platform android --profile "$PROFILE" --output build/app.aab

      - name: Plik deobfuskacji (mapping.txt)
        run: |
          mapping=$(find "$RUNNER_TEMP/eas-build" -path '*/outputs/mapping/release/mapping.txt' -print -quit)
          if [ -n "$mapping" ]; then cp "$mapping" build/mapping.txt
          else echo "::warning::Brak mapping.txt w katalogu roboczym builda"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ env.PROFILE }}-${{ github.run_number }}
          path: |
            build/app.aab
            build/mapping.txt
          retention-days: 14

      - name: Google Play (EAS Submit)
        run: eas submit --non-interactive --platform android --profile "$PROFILE" --path build/app.aab --wait

      # Production: play-notes/vX.Y.Z.txt z commita wydania (streszczenie LLM robi lokalnie apply-version.sh – na runnerze
      # nie ma claude). Staging: streszczenie RELEASE-CANDIDATE przekazane z make staging-play jako input `notes`.
      - name: Nazwa i „Co nowego” w Play
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          NOTES: ${{ inputs.notes }}
        run: |
          export PLAY_SERVICE_ACCOUNT_JSON="$RUNNER_TEMP/play-key.json"
          printf '%s' "$KEY" > "$PLAY_SERVICE_ACCOUNT_JSON"
          if [ "$PROFILE" = production ]; then
            # ten sam tor, na który wysłał EAS Submit (eas.json → submit.production.android.track)
            node scripts/play-notes.js --track "$(node -p "require('./eas.json').submit.production.android.track")"
          elif [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
            node scripts/play-notes.js --track internal --staging --notes-file "$RUNNER_TEMP/notes.txt"
          else
            node scripts/play-notes.js --track internal --staging
          fi
